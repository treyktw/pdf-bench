[package]
name = "pdf-bench"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "pdf_bench"
path = "src/lib.rs"

[[bin]]
name = "pdf-extract-rust"
path = "src/main.rs"

[dependencies]
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
pdfium-render = "0.8"
serde_json = "1"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
wait-timeout = "0.2"
