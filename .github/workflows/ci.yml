name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      # Extractor contract tests + generator tests (determinism, page counts,
      # every kind, fixture reproducibility, no personal metadata).
      - run: python -m pytest -q
      - run: python -m pdf_bench.cli ../fixtures/sample.pdf --no-ocr
      - name: Generator smoke run (long document)
        run: python ../scripts/generate_pdfs.py --kind mixed --pages 200 --out "$RUNNER_TEMP/packet-200p.pdf"

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Fetch PDFium
        run: scripts/fetch-pdfium.sh | sed 's/^export //' >> "$GITHUB_ENV"
      - run: cargo build --release --manifest-path rust/Cargo.toml
      - run: cargo test --manifest-path rust/Cargo.toml
      - run: rust/target/release/pdf-extract-rust fixtures/sample.pdf --no-ocr

  bench:
    runs-on: ubuntu-latest
    needs: [python, rust]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: make bench
      # Small scaling smoke run: the 1- and 10-page rungs only. The 100- and
      # 500-page rungs take minutes on the Python path; run them locally with
      # `make bench-scaling`.
      - name: Scaling smoke run
        run: RUNS=3 make bench-scaling LADDER="1 10"
